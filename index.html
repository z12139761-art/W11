<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毛小孩の家 - 寵物美容工作室</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #e07a5f;
      --primary-light: #fef4ee;
      --secondary: #81b29a;
      --accent: #f2cc8f;
      --dark: #3d405b;
      --text: #4a4a4a;
      --bg: #fdfaf7;
      --card-bg: #ffffff;
      --border: #f0e6dc;
      --shadow: 0 8px 24px rgba(61, 64, 91, 0.08);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.7;
    }

    header {
      background: linear-gradient(135deg, #fceade 0%, #f7d6c8 100%);
      padding: 3.5rem 1.2rem 2.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    header::after {
      content: "🐾";
      font-size: 8rem;
      opacity: 0.07;
      position: absolute;
      right: 5%;
      top: 10%;
      pointer-events: none;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
      padding: 0 1rem;
    }

    .brand-title {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 0.5rem;
      letter-spacing: 1px;
    }

    .brand-subtitle {
      font-size: 1.1rem;
      color: var(--dark);
      margin-bottom: 1.6rem;
      display: inline-block;
      background: rgba(255, 255, 255, 0.65);
      padding: 0.35rem 1.2rem;
      border-radius: 50px;
      font-weight: 500;
    }

    .about-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      margin: -1.5rem auto 2.5rem;
      max-width: 860px;
      border: 1px solid var(--border);
    }

    .intro-text {
      font-size: 1.12rem;
      color: #555;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .intro-text span {
      display: inline-block;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.6rem;
      margin-bottom: 1.8rem;
    }

    .tag {
      background: var(--primary-light);
      color: var(--primary);
      border: 1px solid #f6cfbd;
      padding: 0.4rem 0.9rem;
      border-radius: 20px;
      font-size: 0.92rem;
      font-weight: 600;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 1rem;
      background: #faf6f0;
      padding: 1.2rem 1.5rem;
      border-radius: 14px;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      font-size: 0.98rem;
    }

    .info-item .icon {
      font-size: 1.3rem;
      flex-shrink: 0;
    }

    .info-item strong {
      color: var(--dark);
      display: block;
    }

    .info-item a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 700;
    }

    .info-item a:hover {
      text-decoration: underline;
    }

    /* Section Styles */
    section {
      margin-bottom: 3rem;
    }

    .section-header {
      text-align: center;
      margin-bottom: 1.8rem;
    }

    .section-title {
      font-size: 1.8rem;
      color: var(--dark);
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      position: relative;
    }

    .section-title::after {
      content: "";
      position: absolute;
      bottom: -8px;
      left: 15%;
      width: 70%;
      height: 3px;
      background: var(--secondary);
      border-radius: 2px;
    }

    /* Middle section: Price & Photos */
    .showcase-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 2rem;
    }

    .media-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .media-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 28px rgba(61, 64, 91, 0.12);
    }

    .card-title-bar {
      padding: 1rem 1.5rem;
      background: #faf6f0;
      border-bottom: 1px solid var(--border);
      font-weight: 700;
      color: var(--dark);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.15rem;
    }

    .card-body {
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #fff;
    }

    .card-body img {
      width: 100%;
      height: auto;
      border-radius: 10px;
      display: block;
      object-fit: contain;
    }

    /* Care section */
    .care-container {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 1.5rem;
      max-width: 820px;
      margin: 0 auto;
    }

    .care-container img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      display: block;
    }

    footer {
      text-align: center;
      padding: 2rem 1rem 3rem;
      color: #8c8c8c;
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .brand-title {
        font-size: 2.1rem;
      }
      .about-card {
        padding: 1.4rem;
        margin-top: -1rem;
      }
      .showcase-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
      .info-grid {
        grid-template-columns: 1fr;
        padding: 1rem;
      }
      .care-container {
        padding: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- 1. 最上面：店名與店家介紹、營業時間、預約電話 -->
  <header>
    <div class="container">
      <h1 class="brand-title">🐾 毛小孩の家</h1>
      <p class="brand-subtitle">寵物美容工作室</p>
    </div>
  </header>

  <main class="container">
    <div class="about-card">
      <p class="intro-text">
        <span>我們是一間開在住宅區的小型寵物美容工作室，</span>
        <span>一次只接一隻，不關籠、不趕時間。</span><br>
        <span>怕生、年紀大、第一次美容的毛孩，都可以慢慢來。</span>
      </p>

      <div class="tags">
        <span class="tag">🐕 服務對象：小型犬、中大型犬、貓</span>
        <span class="tag">✨ 一對一精緻美容</span>
        <span class="tag">📸 過程可拍照回報飼主</span>
      </div>

      <div class="info-grid">
        <div class="info-item">
          <span class="icon">🕒</span>
          <div>
            <strong>營業時間</strong>
            週二至週日 10:00–19:00（週一公休）
          </div>
        </div>
        <div class="info-item">
          <span class="icon">📞</span>
          <div>
            <strong>預約電話</strong>
            <a href="tel:0900000000">0900-000-000</a>
          </div>
        </div>
        <div class="info-item">
          <span class="icon">💬</span>
          <div>
            <strong>官方 LINE</strong>
            <span>@maoxiaohai</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 2. 中間：價目表和作品照 -->
    <section>
      <div class="section-header">
        <h2 class="section-title">📋 價目與作品</h2>
      </div>
      <div class="showcase-grid">
        <div class="media-card">
          <div class="card-title-bar">
            <span>🏷️ 服務價目表</span>
          </div>
          <div class="card-body">
            <img src="price.png" alt="毛小孩の家 服務價目表" loading="lazy">
          </div>
        </div>
        <div class="media-card">
          <div class="card-title-bar">
            <span>✂️ 美容作品照</span>
          </div>
          <div class="card-body">
            <img src="photo.png" alt="毛小孩の家 美容作品照" loading="lazy">
          </div>
        </div>
      </div>
    </section>

    <!-- 3. 下面：衛教卡，標題「美容後照護」 -->
    <section>
      <div class="section-header">
        <h2 class="section-title">🩺 美容後照護</h2>
      </div>
      <div class="care-container">
        <img src="care.png" alt="美容後照護衛教卡" loading="lazy">
      </div>
    </section>
  </main>

  <footer>
    <p>© 毛小孩の家 寵物美容工作室 | 用心呵護每一個毛寶貝</p>
    <small style="color: #bbb;">（示範用練習網頁）</small>
  </footer>

</body>
</html>
